<style>
:root{
  /* Layout: Ein-Bildschirm-Werkzeug. Hochkant: Kopf, Bedienung, Plan, Fuss. Quer: Bedienung links, Plan rechts. */
  --bg:#E9EDEA;
  --panel:#F7F9F7;
  --ink:#14201B;
  --ink-2:#55635C;
  --line:#C3CCC6;
  --accent:#17694B;
  --on-accent:#FFFFFF;
  --danger:#B3261E;
  --plan-track:#DCE3DE;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512;--panel:#18211C;--ink:#E7EEE9;--ink-2:#9BAAA1;--line:#33413A;
    --accent:#4CC38A;--on-accent:#06150E;--danger:#F2766B;--plan-track:#212D27;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512;--panel:#18211C;--ink:#E7EEE9;--ink-2:#9BAAA1;--line:#33413A;
  --accent:#4CC38A;--on-accent:#06150E;--danger:#F2766B;--plan-track:#212D27;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "ctl" "map" "bot"}
.top{grid-area:top;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none;background:#fff;border-radius:8px;padding:3px;border:1px solid var(--line)}
.top{align-items:center !important}
.top h1{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
#prog{font-size:15px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{grid-area:ctl;display:flex;flex-direction:column;gap:8px;padding:4px 16px 10px}
.row{display:flex;gap:8px;align-items:center}
.row .lbl{font-size:13px;color:var(--ink-2);flex:none;width:52px}
.seg{display:flex;flex:1;gap:6px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.b{flex:1;min-width:0;min-height:44px;padding:6px 8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.b:focus-visible,.zb:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#people{flex-wrap:wrap}
#people .b{flex:1 1 40%}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.two .seg .b{font-size:14px;padding:6px 4px}
.mini{font-size:12px;color:var(--ink-2);margin:0 0 3px}
.map{grid-area:map;position:relative;min-height:0;min-width:0;margin:0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.map.color{background:#2C3A33}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zb{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.zb.txt{font-size:12px}
.bot{grid-area:bot;display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px}
#info{font-size:15px;line-height:1.3;min-height:40px;margin:0;color:var(--ink-2);display:flex;align-items:center}
#info.strong{color:var(--ink);font-weight:500}
.ghost{flex:1;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:10px;font-size:15px;font-weight:500}
.ghost.danger{color:var(--danger)}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.shade.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:80%;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-bottom:0}
.sheet h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;text-transform:uppercase;text-wrap:balance}
.sheet p{margin:0;font-size:15px;line-height:1.4;color:var(--ink-2)}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:88px;resize:vertical;-webkit-user-select:text;user-select:text}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--danger);font-size:14px;min-height:18px}
.acts{display:flex;gap:8px}
.primary{flex:1;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
.primary.danger{background:var(--danger);color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}
.note.hot{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.num{width:26px;height:26px;border-radius:50%;background:#F29F05;color:#2B1B00;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.note .tx{flex:1;min-width:0;font-size:15px;line-height:1.35;overflow-wrap:anywhere;color:var(--ink)}
.note .meta{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.note button{flex:none;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--danger);font-size:14px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* Plan-Ansicht */
.hall{fill:var(--panel);stroke:var(--line);stroke-width:1}
.floor{fill:none}
.track{fill:var(--plan-track)}
.sand,.mat{fill:none}
.trib{fill:var(--line)}
.ln{fill:none;stroke:var(--ink-2);stroke-width:.9}
.ln.thin{stroke-width:.45}
.ln.dash{stroke-dasharray:3 2}
.wall{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fence{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 2.2;stroke-linejoin:round}
.tag{font-family:var(--font-body);font-size:8.5px;fill:var(--ink-2);text-anchor:middle}
#paint path{stroke-opacity:.62}
/* Farb-Ansicht */
.color .hall{fill:#4E9977;stroke:#3B7A5D}
.color .floor{fill:#57A683}
.color .track{fill:#B4513E}
.color .sand{fill:#DCC48E}
.color .mat{fill:#E7B21C}
.color .trib{fill:#8C9590}
.color .ln{stroke:#FFFFFF;stroke-opacity:.9}
.color .tag{fill:#FFFFFF}
.color .wall,.color .fence{stroke:#10201A}
.color #paint path{stroke-opacity:.82}

@media (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top map" "ctl map" "bot map"}
  .ctl{overflow:auto;padding-bottom:4px}
  .row .lbl{width:38px}
  .b{font-size:14px;padding:4px 6px}
  .seg{flex-wrap:wrap}
  .seg .b{flex:1 1 40%}
  .two{grid-template-columns:1fr}
  .two .seg .b{flex:1 1 28%}
  .map{margin:10px 16px 10px 0}
  .top h1{font-size:22px}
  #info{min-height:32px;font-size:14px}
  .bot{padding-top:4px}
}
@media (prefers-reduced-motion:no-preference){.b,.zb{transition:background-color .12s}}
</style>
</head>
<body>

var KEY="putzplan-halle-v3";
var W0=740,H0=322;
var S={who:0,mode:"paint",brush:"all",view:"plan"};
var notes=[];
var $=function(id){return document.getElementById(id)};
var svg=$("svg"),world=$("world"),map=$("map"),laneG=$("lanes"),paintG=$("paint"),pinG=$("pins"),info=$("info");

function dstr(off){var d=new Date();d.setDate(d.getDate()-(off||0));return d.getDate()+"."+(d.getMonth()+1)+"."}
function say(t,strong){info.textContent=t;info.className=strong?"strong":""}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- Bahnen und Streifen ---------- */
var lanes=[],hallEl=$("hallp"),gcount={};
function inHall(p){try{var pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;return hallEl.isPointInFill(pt)}catch(e){return p.x>=6&&p.x<=697&&p.y>=6&&p.y<=315}}
var ZAUN=[[661,202],[655,277],[634,307],[591,307],[591,280]];
function inPoly(p,q){var c=false;for(var i=0,j=q.length-1;i<q.length;j=i++){var a=q[i],b=q[j];if((a[1]>p.y)!==(b[1]>p.y)&&p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function region(p){
  if(p.x>=31&&p.x<=731&&p.y>=18&&p.y<=57)return"gerade";
  if(!inHall(p))return null;
  var dx=p.x<268?268-p.x:p.x>552?p.x-552:0,r=Math.hypot(dx,p.y-173);
  if(r<=80)return"inf";
  if(r<=113)return"track";
  if(p.x>=158&&p.x<=563&&p.y>=303&&p.y<=315)return"tunnel";
  if(p.x>=351&&p.x<=364&&p.y>=286&&p.y<303)return"gang";
  if(inPoly(p,ZAUN))return"zaun";
  if(p.x>=119&&p.x<=150&&p.y>=57)return"anlauf";
  return"out";
}
function addLane(d,closed,w,grp,reg,label,clip){
  var el=document.createElementNS(NS,"path");el.setAttribute("d",d);laneG.appendChild(el);
  var L=el.getTotalLength(),pts=[];
  for(var s=0;s<L;s+=3){var q=el.getPointAtLength(s);pts.push({s:s,x:q.x,y:q.y})}
  var n=Math.max(1,Math.round(L/5)),g=document.createElementNS(NS,"g");
  if(clip)g.setAttribute("clip-path","url(#"+clip+")");
  paintG.appendChild(g);
  var gi=gcount[grp]||0;gcount[grp]=gi+1;
  var l={d:d,closed:closed,w:w,grp:grp,gi:gi,reg:reg,label:label,L:L,pts:pts,n:n,ps:L/n,st:new Array(n).fill(null),g:g,valid:null};
  if(clip){l.valid=[];for(var i=0;i<n;i++){var c=el.getPointAtLength((i+0.5)*l.ps);l.valid.push(region(c)===reg)}}
  lanes.push(l);return l;
}
function rows(n,y0,y1,xa,xb,grp,reg,label,clip){var h=(y1-y0)/n;for(var k=0;k<n;k++){var y=(y0+h*(k+0.5)).toFixed(2);addLane("M"+xa+" "+y+" H"+xb,false,h,grp,reg,typeof label==="function"?label(k):label,clip)}}
function cols(n,x0,x1,ya,yb,grp,reg,label,clip){var w=(x1-x0)/n;for(var k=0;k<n;k++){var x=(x0+w*(k+0.5)).toFixed(2);addLane("M"+x+" "+ya+" V"+yb,false,w,grp,reg,typeof label==="function"?label(k):label,clip)}}
rows(6,18,57,31,731,"gerade","gerade",function(k){return"Sprintgerade, Bahn "+(k+1)},null);
[110.25,104.75,99.25,93.75,88.25,82.75].forEach(function(r,i){
  addLane("M268 "+(173-r)+" H552 A"+r+" "+r+" 0 0 1 552 "+(173+r)+" H268 A"+r+" "+r+" 0 0 1 268 "+(173-r)+" Z",true,5.5,"rund","track","Rundbahn, Bahn "+(6-i),null);
});
rows(6,93,134,188,632,"innen-a","inf","Innenfeld, Seite zur Sprintgeraden","inf");
rows(8,134,183,188,632,"innen-b","inf",function(k){return"Innenfeld, Sprintbahn "+(k+1)},"inf");
rows(10,183,253,188,632,"innen-c","inf","Innenfeld, Seite zur Tribüne","inf");
cols(4,119,150,60,314,"anlauf","anlauf",function(k){return"Anlaufbahn am Kopfende, Bahn "+(k+1)},null);
cols(16,6,119,57,315,"kopf-aussen","out","Kopfende, Wurfbereich","outc");
cols(17,150,268,57,315,"kopf-innen","out","Fläche zwischen Anlaufbahn und Rundbahn","outc");
cols(21,552,697,57,315,"ende","out","Fläche hinter der Rundbahn","outc");
rows(2,303,315,158,563,"tunnel","tunnel","Lauftunnel",null);
cols(2,351,364,286,303,"gang","gang","Gang vom Lauftunnel in die Halle",null);
cols(10,591,661,200,307,"zaun","zaun","Eingezäunter Bereich","zaunc");
function near(l,p){var b=null,bd=1e9;for(var i=0;i<l.pts.length;i++){var q=l.pts[i],d=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y);if(d<bd){bd=d;b=q}}return{s:b.s,dist:Math.sqrt(bd)}}
function key(v){return v?v.p+"|"+v.d:""}
function seg(l,a,len,v){
  var el=document.createElementNS(NS,"path");el.setAttribute("d",l.d);
  el.setAttribute("stroke",(PEOPLE[v.p]||PEOPLE[0]).c);el.setAttribute("stroke-width",l.w);
  if(len<l.L-0.01){el.setAttribute("stroke-dasharray",len.toFixed(2)+" "+(l.L-len+0.01).toFixed(2));el.setAttribute("stroke-dashoffset",(-a).toFixed(2))}
  l.g.appendChild(el);
}
function render(l){
  while(l.g.firstChild)l.g.removeChild(l.g.firstChild);
  var n=l.n,start=0;
  if(l.closed){var f=-1;for(var i=0;i<n;i++){if(key(l.st[i])!==key(l.st[(i+n-1)%n])){f=i;break}}
    if(f<0){if(l.st[0])seg(l,0,l.L,l.st[0]);return}start=f}
  var k=0;
  while(k<n){var idx=(start+k)%n,v=l.st[idx],c=1;
    while(k+c<n&&key(l.st[(start+k+c)%n])===key(v))c++;
    if(v)seg(l,idx*l.ps,c*l.ps,v);k+=c}
}
function fill(l,a,b,v){
  var i0=Math.floor(Math.min(a,b)/l.ps),i1=Math.min(Math.floor(Math.max(a,b)/l.ps),i0+l.n-1);
  for(var i=i0;i<=i1;i++){var x=l.closed?((i%l.n)+l.n)%l.n:i;if(x<0||x>=l.n||(l.valid&&!l.valid[x]))continue;l.st[x]=v}
}
function progress(){
  var tot=0,done=0;
  lanes.forEach(function(l){var a=l.ps*l.w;for(var i=0;i<l.n;i++){if(l.valid&&!l.valid[i])continue;tot+=a;if(l.st[i])done+=a}});
  $("prog").textContent=Math.round(done/tot*100)+" % geputzt";
}

/* ---------- Speichern (nur dieses Gerät) ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({who:S.who,brush:S.brush,view:S.view,notes:notes,
    lanes:lanes.map(function(l){return l.st.map(function(v){return v?[v.p,v.d]:0})})}))}catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return false;
    var o=JSON.parse(raw);if(!o||!Array.isArray(o.lanes)||o.lanes.length!==lanes.length)return false;
    for(var i=0;i<lanes.length;i++){if(!Array.isArray(o.lanes[i])||o.lanes[i].length!==lanes[i].n)return false}
    lanes.forEach(function(l,i){l.st=o.lanes[i].map(function(v){return v?{p:v[0],d:v[1]}:null})});
    notes=Array.isArray(o.notes)?o.notes:[];
    if(PEOPLE[o.who])S.who=o.who;
    if(o.brush==="one"||o.brush==="all"||o.brush==="mid")S.brush=o.brush;
    if(o.view==="plan"||o.view==="color")S.view=o.view;
    return true;
  }catch(e){return false}
}
function demo(){
  lanes.forEach(function(l){
    if(l.grp==="rund")fill(l,284,284+(l.L-568)/2-0.1,{p:0,d:dstr(0)});
    if(l.grp==="innen-b")fill(l,0,200,{p:2,d:dstr(1)});
    if(l.grp==="kopf-innen")fill(l,0,130,{p:1,d:dstr(1)});
    if(l.grp==="gerade")fill(l,0,260,{p:3,d:dstr(0)});
  });
  notes=[{x:277,y:208,t:"Matte liegt noch, nicht drunter gewischt",by:"Arno",d:dstr(1)}];
}

/* ---------- Ansicht: Drehen, Zoomen, Schieben ---------- */
var V={z:1,cx:W0/2,cy:H0/2},portrait=false,OW=W0,OH=H0;
function orient(){
  var r=map.getBoundingClientRect(),p=r.height>r.width;
  if(p!==portrait||!orient.done){
    portrait=p;orient.done=true;
    OW=p?H0:W0;OH=p?W0:H0;
    world.setAttribute("transform",p?"translate("+H0+",0) rotate(90)":"");
    V.z=1;V.cx=OW/2;V.cy=OH/2;drawPins();
  }
  applyView();
}
function applyView(){
  var r=map.getBoundingClientRect();if(r.width<2||r.height<2)return;
  var ca=r.width/r.height,wa=OW/OH,bw,bh;
  if(ca>wa){bh=OH*1.03;bw=bh*ca}else{bw=OW*1.03;bh=bw/ca}
  V.z=clamp(V.z,1,10);
  var w=bw/V.z,h=bh/V.z;
  V.cx=w>=OW?OW/2:clamp(V.cx,w/2-12,OW-w/2+12);
  V.cy=h>=OH?OH/2:clamp(V.cy,h/2-12,OH-h/2+12);
  svg.setAttribute("viewBox",(V.cx-w/2).toFixed(2)+" "+(V.cy-h/2).toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2));
}
function conv(el,x,y){var m=el.getScreenCTM();if(!m)return{x:0,y:0};var p=svg.createSVGPoint();p.x=x;p.y=y;p=p.matrixTransform(m.inverse());return{x:p.x,y:p.y}}
function toOuter(x,y){return conv(svg,x,y)}
function toWorld(x,y){return conv(world,x,y)}
function zoomAt(x,y,z){
  var a=toOuter(x,y);V.z=z;applyView();
  var b=toOuter(x,y);V.cx+=a.x-b.x;V.cy+=a.y-b.y;applyView();
}
function zoomBtn(f){var r=map.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,V.z*f)}
$("z-in").addEventListener("click",function(){zoomBtn(1.5)});
$("z-out").addEventListener("click",function(){zoomBtn(1/1.5)});
$("z-fit").addEventListener("click",function(){V.z=1;V.cx=OW/2;V.cy=OH/2;applyView()});
svg.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,V.z*(e.deltaY<0?1.15:1/1.15))},{passive:false});

/* ---------- Finger und Maus ---------- */
var ptrs=new Map(),gesture=null,act=null,pan=null,pinch=null;
function hit(p){var reg=region(p);if(!reg)return null;var best=null,bd=1e9;lanes.forEach(function(l){if(l.reg!==reg)return;var n=near(l,p);if(n.dist<=l.w/2+2.5&&n.dist<bd){bd=n.dist;best={l:l,s:n.s}}});return best}
function lockStroke(p){
  var h=hit(p);if(!h)return;
  var span=gcount[h.l.grp]<=8?1:2;
  var set=S.brush==="one"?[h.l]:lanes.filter(function(l){return l.grp===h.l.grp&&(S.brush==="all"||Math.abs(l.gi-h.l.gi)<=span)});
  act.items=set.map(function(l){return{l:l,prev:near(l,p).s,snap:l.st.slice()}});
}
function strokeMove(e){
  if(!act.moved&&Math.hypot(e.clientX-act.sx,e.clientY-act.sy)<6)return;
  act.moved=true;
  var p=toWorld(e.clientX,e.clientY);
  if(!act.items){lockStroke(p);if(!act.items)return}
  var v=S.mode==="paint"?{p:S.who,d:dstr(0)}:null;
  act.items.forEach(function(it){
    var l=it.l,s=near(l,p).s,d=s-it.prev;
    if(l.closed){if(d>l.L/2)d-=l.L;if(d<-l.L/2)d+=l.L}
    fill(l,it.prev,it.prev+d,v);it.prev=s;render(l);
  });
  act.changed=true;
  say(S.mode==="paint"?PEOPLE[S.who].n+" trägt geputzt ein.":"Wird wieder auf offen gesetzt.",false);
}
function cancelStroke(){
  if(act&&act.items)act.items.forEach(function(it){it.l.st=it.snap;render(it.l)});
  act=null;
}
function midDist(){
  var a=Array.from(ptrs.values());
  return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};
}
function tap(x,y){
  var p=toWorld(x,y);
  for(var i=notes.length-1;i>=0;i--){if(Math.hypot(notes[i].x-p.x,notes[i].y-p.y)<13){openNotes(i);return}}
  if(S.mode==="note"){
    if(!region(p)){say("Tipp auf eine Stelle in der Halle.",false);return}
    openEdit(p);return;
  }
  var h=hit(p);
  if(!h){say("Hier ist kein Bereich zum Eintragen hinterlegt.",false);return}
  var v=h.l.st[Math.min(h.l.n-1,Math.floor(h.s/h.l.ps))];
  if(v)say(h.l.label+": geputzt von "+(PEOPLE[v.p]||{n:"?"}).n+" am "+v.d,true);
  else say(h.l.label+": noch offen.",false);
}
svg.addEventListener("pointerdown",function(e){
  try{svg.setPointerCapture(e.pointerId)}catch(err){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    if(gesture==="stroke")cancelStroke();
    pan=null;gesture="pinch";
    var m=midDist();pinch={A:toOuter(m.x,m.y),d0:m.d,z0:V.z};return;
  }
  if(ptrs.size>2)return;
  if(S.mode==="paint"||S.mode==="erase"){
    gesture="stroke";act={sx:e.clientX,sy:e.clientY,moved:false,items:null,changed:false};
    lockStroke(toWorld(e.clientX,e.clientY));
  }else{
    gesture="pan";pan={sx:e.clientX,sy:e.clientY,moved:false,A:toOuter(e.clientX,e.clientY)};
  }
});
svg.addEventListener("pointermove",function(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gesture==="pinch"&&ptrs.size>=2){
    var m=midDist();V.z=pinch.z0*m.d/pinch.d0;applyView();
    var b=toOuter(m.x,m.y);V.cx+=pinch.A.x-b.x;V.cy+=pinch.A.y-b.y;applyView();
  }else if(gesture==="stroke"&&act){strokeMove(e)}
  else if(gesture==="pan"&&pan){
    if(!pan.moved&&Math.hypot(e.clientX-pan.sx,e.clientY-pan.sy)<6)return;
    pan.moved=true;
    var c=toOuter(e.clientX,e.clientY);V.cx+=pan.A.x-c.x;V.cy+=pan.A.y-c.y;applyView();
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(gesture==="pinch"){if(ptrs.size<2)gesture=ptrs.size?"dead":null;return}
  if(gesture==="dead"){if(!ptrs.size)gesture=null;return}
  if(gesture==="stroke"&&act){
    if(!act.moved&&e.type==="pointerup")tap(e.clientX,e.clientY);
    else if(act.changed){progress();save()}
    act=null;
  }else if(gesture==="pan"&&pan){
    if(!pan.moved&&e.type==="pointerup")tap(e.clientX,e.clientY);
    pan=null;
  }
  gesture=null;
}
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);

/* ---------- Notizen ---------- */
function drawPins(){
  while(pinG.firstChild)pinG.removeChild(pinG.firstChild);
  notes.forEach(function(n,i){
    var c=document.createElementNS(NS,"circle");c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);c.setAttribute("r",8);
    c.setAttribute("fill","#F29F05");c.setAttribute("stroke","#2B1B00");c.setAttribute("stroke-width","1");pinG.appendChild(c);
    var t=document.createElementNS(NS,"text");t.setAttribute("x",n.x);t.setAttribute("y",n.y+3.4);t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size","9.5");t.setAttribute("font-weight","600");t.setAttribute("fill","#2B1B00");t.setAttribute("font-family","Barlow, sans-serif");
    if(portrait)t.setAttribute("transform","rotate(-90 "+n.x+" "+n.y+")");
    t.textContent=String(i+1);pinG.appendChild(t);
  });
  $("open-notes").textContent="Notizen ("+notes.length+")";
}
function show(id,on){$(id).classList.toggle("open",on)}
var pend=null;
function openEdit(p){
  pend={x:Math.round(p.x),y:Math.round(p.y)};
  $("edit-who").textContent="Notiz von "+PEOPLE[S.who].n+" für die angetippte Stelle.";
  $("note-text").value="";$("note-err").textContent="";show("sh-edit",true);
  setTimeout(function(){try{$("note-text").focus()}catch(e){}},50);
}
$("note-text").addEventListener("input",function(){$("note-err").textContent=""});
$("edit-cancel").addEventListener("click",function(){show("sh-edit",false);pend=null});
$("edit-save").addEventListener("click",function(){
  var t=$("note-text").value.trim();
  if(!t){$("note-err").textContent="Schreib erst einen Satz in das Feld.";return}
  notes.push({x:pend.x,y:pend.y,t:t,by:PEOPLE[S.who].n,d:dstr(0)});pend=null;
  show("sh-edit",false);drawPins();save();say("Notiz "+notes.length+" gespeichert.",true);
});
function openNotes(hot){
  var box=$("note-list");while(box.firstChild)box.removeChild(box.firstChild);
  if(!notes.length){var p=document.createElement("p");p.textContent="Wähl oben Notiz und tipp auf eine Stelle im Plan, um die erste Notiz zu setzen.";box.appendChild(p)}
  notes.forEach(function(n,i){
    var row=document.createElement("div");row.className="note"+(i===hot?" hot":"");
    var num=document.createElement("span");num.className="num";num.textContent=String(i+1);
    var tx=document.createElement("span");tx.className="tx";tx.textContent=n.t;
    var meta=document.createElement("span");meta.className="meta";meta.textContent=n.by+", "+n.d;tx.appendChild(meta);
    var del=document.createElement("button");del.textContent="Löschen";del.setAttribute("aria-label","Notiz "+(i+1)+" löschen");
    del.addEventListener("click",function(){notes.splice(i,1);drawPins();save();openNotes(-1)});
    row.appendChild(num);row.appendChild(tx);row.appendChild(del);box.appendChild(row);
    if(i===hot)setTimeout(function(){try{row.scrollIntoView({block:"nearest"})}catch(e){}},30);
  });
  show("sh-notes",true);
}
$("open-notes").addEventListener("click",function(){openNotes(-1)});
$("notes-close").addEventListener("click",function(){show("sh-notes",false)});

/* ---------- Zurücksetzen ---------- */
$("open-reset").addEventListener("click",function(){$("reset-notes").checked=false;show("sh-reset",true)});
$("reset-cancel").addEventListener("click",function(){show("sh-reset",false)});
$("reset-go").addEventListener("click",function(){
  lanes.forEach(function(l){l.st.fill(null);render(l)});
  if($("reset-notes").checked){notes=[];drawPins()}
  progress();save();show("sh-reset",false);say("Alle Flächen stehen wieder auf offen.",false);
});
["sh-edit","sh-notes","sh-reset"].forEach(function(id){
  $(id).addEventListener("click",function(e){if(e.target===$(id)){show(id,false);if(id==="sh-edit")pend=null}});
});

/* ---------- Bedienleiste ---------- */
var HINT={paint:"Mit dem Finger über einen Bereich ziehen. Zwei Finger zoomen und schieben.",
  erase:"Über eine Fläche ziehen, um sie wieder auf offen zu setzen.",
  note:"Auf die Stelle im Plan tippen, zu der die Notiz gehört.",
  move:"Mit einem Finger den Plan schieben. Antippen zeigt, wer geputzt hat."};
function syncButtons(){
  document.querySelectorAll(".b[data-k]").forEach(function(b){b.setAttribute("aria-pressed",String(S[b.dataset.k]===b.dataset.v||(b.dataset.k==="who"&&S.who===+b.dataset.v)))});
  map.classList.toggle("color",S.view==="color");
  svg.style.cursor=S.mode==="move"||S.mode==="note"?"grab":"crosshair";
}
PEOPLE.forEach(function(p,i){
  var b=document.createElement("button");b.className="b";b.id="who-"+i;b.dataset.k="who";b.dataset.v=String(i);
  var d=document.createElement("span");d.className="dot";d.style.background=p.c;
  b.appendChild(d);b.appendChild(document.createTextNode(p.n));$("people").appendChild(b);
});
document.querySelectorAll(".b[data-k]").forEach(function(b){
  b.addEventListener("click",function(){
    var k=b.dataset.k;S[k]=k==="who"?+b.dataset.v:b.dataset.v;
    syncButtons();save();
    if(k==="mode")say(HINT[S.mode],false);
    if(k==="who")say(PEOPLE[S.who].n+" ist ausgewählt.",true);
  });
});

/* ---------- Start ---------- */
var had=load();
if(!had)demo();
lanes.forEach(render);progress();syncButtons();
orient();drawPins();
say(had?HINT[S.mode]:"Beispieldaten zum Ausprobieren. Zurücksetzen leert den Plan.",false);
if(window.ResizeObserver){new ResizeObserver(orient).observe(map)}else{window.addEventListener("resize",orient)}
})();
</script>
</body>
